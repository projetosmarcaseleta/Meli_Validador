[project]
name = "agrupar-anuncios-tubarao"
version = "0.1.0"
description = "Normaliza PARENT_PK e family_name para agrupar anúncios de tênis no Mercado Livre."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "fpdf2>=2.8",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
agrupar = "agrupar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agrupar*"]

[tool.setuptools.package-data]
agrupar = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
