name: Deploy Meli Validador to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            APP_DIR="/var/www/Meli_Validador"
            
            echo "📦 Atualizando repositório Meli_Validador..."
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/projetosmarcaseleta/Meli_Validador.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            
            echo "🐍 Configurando ambiente virtual..."
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            
            echo "📥 Instalando dependências..."
            pip install -r requirements.txt --quiet
            
            echo "🔄 Reiniciando serviço..."
            sudo systemctl restart meli-validador

            echo "✅ Deploy do Meli Validador concluído com sucesso!"

            TRIAGEM_DIR="$APP_DIR/triagem"

            if [ -d "$TRIAGEM_DIR" ]; then
              echo "📦 Atualizando Meli Triagem..."
              cd "$TRIAGEM_DIR"

              if [ ! -d "venv" ]; then
                python3 -m venv venv
              fi
              source venv/bin/activate
              pip install -r requirements.txt --quiet

              if [ ! -f "$TRIAGEM_DIR/.env" ]; then
                printf 'PORT=3008\nFLASK_DEBUG=0\n' > "$TRIAGEM_DIR/.env"
              fi

              sudo cp "$TRIAGEM_DIR/deploy/meli-triagem.service" /etc/systemd/system/meli-triagem.service
              sudo systemctl daemon-reload
              sudo systemctl enable meli-triagem
              sudo systemctl restart meli-triagem

              echo "✅ Deploy do Meli Triagem concluído com sucesso!"
            fi
